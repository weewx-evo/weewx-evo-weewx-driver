[project]
name = "weewx-evo-weewx-driver"
version = "0.1.0"
description = "Run any WeeWX driver as a weewx-evo collector, without installing WeeWX."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Manuel Hilgert"}]
keywords = ["weewx", "weewx-evo", "weather-station", "driver", "vantage", "usb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.11"

# Nothing. That is the whole point of `weewxnames.py`: a WeeWX driver's
# `import weewx` is stood in for, so running one costs the driver file and
# nothing else. pyusb or pyserial are the driver's business and are installed
# where the hardware needs them -- `hardware` says which are missing and what
# they are called on PyPI, because the import name and the package name
# differ and nobody guesses `pyusb` from `usb`.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/weewx-evo/weewx-evo-weewx-driver"
Issues = "https://github.com/weewx-evo/weewx-evo-weewx-driver/issues"

# The command. Its own rather than a subcommand of `weewx-evo`: an add-on
# cannot reach into another package's argument parser, and a core that had to
# be told about every add-on's commands would be a core that knows what
# add-ons exist.
[project.scripts]
weewx-evo-weewx-driver = "weewx_evo_weewx_driver.cli:main"

# What this contributes to the collector menu on the settings page. The core
# walks this group and asks each entry for a `Kind`; ours says what it reads,
# what to type to start it, and which fields its page has.
[project.entry-points."weewx_evo.collectors"]
weewx-driver = "weewx_evo_weewx_driver:collector_kind"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tools", "tests"]

# The version, for the same reason as the rule list below. ISC004 does not
# exist before 0.16, so a repository that names it and a ruff that has never
# heard of it produce "Unknown rule selector" -- which reads like the config
# is broken rather than the tool being old, and which the test image found by
# pinning a different one. Named here, a mismatch says which version is wanted.
required-version = ">=0.16"

# Named rather than left to the default. ruff's default set grows between
# releases, and a check that changes underneath the repository is one that
# either blocks a commit for a rule nobody chose or stops finding what it
# used to. This list is the choice; an update to it is a decision.
[tool.ruff.lint]
select = [
    "F",      # pyflakes: the findings that are always a bug
    "E", "W", # pycodestyle
    "I",      # import order
    "N",      # naming
    "UP",     # what this Python version does better
    "B",      # bugbear: the traps that look fine
    "C4",     # comprehensions
    "SIM",    # simplifications
    "ISC",    # implicit string concatenation
    "PIE",
    "BLE",    # bare and blind excepts
    "S",      # bandit
    "PLE", "PLW",  # pylint, the errors and warnings -- not its metrics
    "FURB",
    "RUF",
]

# Each of these is a decision this project already made, and a check that
# argues with it every commit is a check people learn to skip.
ignore = [
    # An isolation boundary catches everything by design. A driver that
    # raises must not take the listener with it, an export that cannot
    # reach its host is not the archiver's problem, and pyephem's
    # "never rises" cannot be named without importing an optional package.
    # Twenty-eight of those, each with the reason on the line above it.
    "BLE001",
    # Bound to 0.0.0.0, answered only to private networks. That is the
    # arrangement, written down, and `netaccess.py` is what enforces it.
    "S104",
    # The schema comes from the file, so table and column names are
    # interpolated into SQL. That is the one rule this project has. The
    # names come out of the database's own schema, never from a request.
    "S608",
    # WeeWX's names, which are not ours to change: `dateTime` and
    # `usUnits` are columns, `windSpeed_vt` is a reading, and
    # `UnknownAggregation` is caught by name in skin code.
    "N806", "N815", "N818",
    # `/var/tmp/weewx-evo-ecowitt-report.txt` is where the driver's report
    # goes, and it is a setting -- `report_file` -- for the installation
    # that wants it elsewhere.
    "S108",
    # WeeWX's names again, this time as arguments: `outTemp`, `windGust`.
    "N803",
    # `global` for the one lazily-filled registry, and for the one resolved
    # Settings. That arrangement is deliberate and written down: a module
    # is imported once, so there is exactly one of it, which is what makes
    # `settings.running()` work where `from .cli import _RESOLVED` did not.
    "PLW0603",
    # Rebinding the loop variable is how a packet gets its raw body back
    # and how a vector gets normalised. A second name for the same thing
    # one line later is not clearer.
    "PLW2901",
    # `subprocess.run` with the command built here and `check=False`,
    # because the return code is read rather than raised on -- rsync
    # answering 24 ("files vanished") is not a failure.
    "S603",
    # These say "write it differently", not "this is wrong", and each one
    # here would cost something: `contextlib.suppress` for a bare
    # try/except/pass hides which line may raise, a collapsed `if` loses
    # the comment between the two conditions, and `[*a, *b]` for `a + b`
    # pushed three lines over the limit the first time it was applied.
    "SIM102", "SIM103", "SIM105", "SIM108", "RUF005",
]

[tool.ruff.lint.per-file-ignores]
# The test tools assert, hold made-up tokens, run subprocesses and talk to
# the server they just started on loopback. All four are what they are for.
# A test tool that swallows an exception and moves on to the next case is
# doing its job: the run has to reach the end to report a count.
"tools/*" = ["S101", "S105", "S106", "S112", "S310", "S603", "S607"]
"tests/*" = ["S101", "S105", "S106", "S112", "S310", "S603", "S607"]
# The simulators pretend to be a serial port, a USB bus and rtl_433, so they
# carry those libraries' names rather than names a linter would prefer.
"tools/*sim.py" = ["N802", "N803", "N806"]
