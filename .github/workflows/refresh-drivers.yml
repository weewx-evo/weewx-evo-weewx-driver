# Fetch WeeWX' drivers again, once a week, and open a pull request if they moved.
#
# This package ships the thirteen drivers WeeWX ships, so that a machine with
# no WeeWX has something to run. That copy goes stale on its own: WeeWX
# releases, the file changes, and nothing here notices. Measured over four
# years its drivers took 18 commits -- rare enough that nobody would think to
# check, often enough to matter.
#
# **A branch, never a commit to main.** A driver changing is a change to what
# this package runs on somebody's hardware. The run installs that exact WeeWX
# release and puts every test through it first, so what is pushed is a diff
# that has already been measured -- but the last look is a person's.

name: refresh-drivers

on:
  schedule:
    # Mondays, 05:17 UTC. Off the hour on purpose: GitHub queues everything
    # scheduled on the hour, and a job that starts twenty minutes late for a
    # weekly check is a job that looks broken for no reason.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-drivers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the drivers from WeeWX' latest release
        id: fetch
        run: |
          python tools/refresh.py
          tag=$(sed -n 's/^tag *//p' src/weewx_evo_weewx_driver/drivers/PROVENANCE)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- src/weewx_evo_weewx_driver/drivers; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when something actually changed. A weekly
      # job that installs WeeWX and runs the suite to prove nothing happened
      # is one nobody looks at after a month.
      - name: Install that WeeWX release, and weewx-evo
        if: steps.fetch.outputs.moved == 'yes'
        run: |
          python -m pip install --upgrade pip
          # The comparison in alldrivers_test has to run against the same
          # release the files came from. A different one reports differences
          # that are WeeWX' own history rather than ours.
          python -m pip install "weewx==${TAG#v}"
          python -m pip install "git+https://github.com/hilman2/weewx-evo"
        env:
          TAG: ${{ steps.fetch.outputs.tag }}

      - name: Run the tests against it
        if: steps.fetch.outputs.moved == 'yes'
        run: python tools/runtests.py

      # A branch, and the link to open the pull request from. Not the pull
      # request itself: that needs "Allow GitHub Actions to create and
      # approve pull requests" under Settings -> Actions, and a workflow
      # that fails weekly on a permission is worse than one click a year.
      - name: Push the branch
        if: steps.fetch.outputs.moved == 'yes'
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B refresh-drivers
          git add src/weewx_evo_weewx_driver/drivers
          git commit -m "Take the drivers from WeeWX ${TAG}" -m \
            "Fetched by tools/refresh.py from the release tarball, byte for
          byte, with the digests in PROVENANCE rewritten. The whole suite ran
          against that WeeWX release before this was pushed.

          Worth reading before merging: which drivers changed, and whether any
          of them touches the engine. A driver that is also a service (Vantage
          is) reaches the shim's event dispatch, and that is the part with no
          hardware behind it here."
          git push --force origin refresh-drivers
          {
            echo "### WeeWX ${TAG} moved the drivers"
            echo
            echo "Pushed to \`refresh-drivers\`, tests green against that release."
            echo
            echo "[Open the pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...refresh-drivers?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"
