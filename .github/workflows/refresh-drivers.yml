# Fetch WeeWX' drivers again, once a week, and open a pull request if they moved.
#
# This package ships the thirteen drivers WeeWX ships, so that a machine with
# no WeeWX has something to run. That copy goes stale on its own: WeeWX
# releases, the file changes, and nothing here notices. Measured over four
# years its drivers took 18 commits -- rare enough that nobody would think to
# check, often enough to matter.
#
# **A pull request, never a commit to main.** A driver changing is a change to
# what this package runs on somebody's hardware. The run installs that exact
# WeeWX release and puts every test through it first, so what arrives is a
# diff that has already been measured -- but the last look is a person's.

name: refresh-drivers

on:
  schedule:
    # Mondays, 05:17 UTC. Off the hour on purpose: GitHub queues everything
    # scheduled on the hour, and a job that starts twenty minutes late for a
    # weekly check is a job that looks broken for no reason.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          WeeWX release to take, e.g. v5.4.0. Empty means the latest, which is
          what the weekly run uses. An older one is how this whole path gets
          exercised while WeeWX is standing still -- the pull request it opens
          then is a step BACKWARDS and must be closed, not merged.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-drivers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the drivers from WeeWX' latest release
        id: fetch
        env:
          WANTED: ${{ inputs.tag }}
        run: |
          # Written out rather than as ${WANTED:+--tag "$WANTED"}: the quotes
          # inside a parameter expansion are not quoting, so a value with a
          # space in it would arrive as two arguments.
          if [ -n "$WANTED" ]; then
            python tools/refresh.py --tag "$WANTED"
          else
            python tools/refresh.py
          fi
          tag=$(sed -n 's/^tag *//p' src/weewx_evo_weewx_driver/drivers/PROVENANCE)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- src/weewx_evo_weewx_driver/drivers; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
          else
            echo "moved=yes" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when something actually changed. A weekly
      # job that installs WeeWX and runs the suite to prove nothing happened
      # is one nobody looks at after a month.
      - name: Install that WeeWX release, and weewx-evo
        if: steps.fetch.outputs.moved == 'yes'
        run: |
          python -m pip install --upgrade pip
          # The comparison in alldrivers_test has to run against the same
          # release the files came from. A different one reports differences
          # that are WeeWX' own history rather than ours.
          python -m pip install "weewx==${TAG#v}"
          python -m pip install "git+https://github.com/hilman2/weewx-evo"
        env:
          TAG: ${{ steps.fetch.outputs.tag }}

      - name: Run the tests against it
        if: steps.fetch.outputs.moved == 'yes'
        run: python tools/runtests.py

      # The pull request itself. It needs "Allow GitHub Actions to create and
      # approve pull requests", which is an *organisation* setting -- the
      # repository one cannot be turned on while the organisation forbids it,
      # and the API answers 409 saying so.
      - name: Open a pull request
        if: steps.fetch.outputs.moved == 'yes'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh-drivers
          delete-branch: true
          title: "WeeWX ${{ steps.fetch.outputs.tag }} drivers"
          commit-message: |
            Take the drivers from WeeWX ${{ steps.fetch.outputs.tag }}

            Fetched by tools/refresh.py from the release tarball, byte for
            byte, with the digests in PROVENANCE rewritten. The whole suite
            ran against that WeeWX release before this was opened.
          body: |
            `tools/refresh.py` found the shipped drivers differ from WeeWX
            ${{ steps.fetch.outputs.tag }}. The diff is the drivers as that
            release has them; nothing here was edited.

            The suite ran against `weewx==${{ steps.fetch.outputs.tag }}` with
            these files in place, `alldrivers_test.py` included -- which is
            the check that each of the thirteen behaves the same under the
            stand-in as under WeeWX itself.

            Worth reading before merging: which drivers changed, and whether
            any of them touches the engine. A driver that is also a service
            (Vantage is) reaches the shim's event dispatch, and that is the
            part with no hardware behind it here.

            **If this run was started by hand with an older tag, this is a
            step backwards.** Close it rather than merging.
